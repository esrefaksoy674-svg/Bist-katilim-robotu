<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><link rel="manifest" href="manifest.json"><title>BIST Katılım Robotu</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#f5f7fa;font-family:Arial,sans-serif}header{padding:22px 18px 10px}h1{font-size:22px;margin:0 0 7px}.sub,.meta{color:#9eb0bf;font-size:12px}.wrap{padding:10px 14px 80px}.status,.card{background:#0e1b26;border:1px solid #183044;border-radius:14px;padding:14px;margin:10px 0}.green{color:#46dc7d}.title{font-weight:bold;margin:20px 4px 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.sym{font-size:18px;font-weight:bold}.badge{padding:6px 9px;border-radius:9px;background:#173d2a;color:#46dc7d;font-size:12px;font-weight:bold}.watch{background:#403b17;color:#f1d65a}.score{font-size:22px;font-weight:bold}.bar{height:5px;background:#1c2d3a;border-radius:4px;margin-top:10px}.fill{height:100%;background:#46dc7d;border-radius:4px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#46dc7d;font-weight:bold;font-size:15px;margin-top:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#0b1822;border-top:1px solid #183044;display:flex;justify-content:space-around;padding:12px 4px;font-size:11px;color:#a9bac7}</style></head><body><header><h1>📈 BIST KATILIM ROBOTU</h1><div class="sub">Telefon sürümü • Simülasyon</div></header><div class="wrap"><div class="status"><div class="green">● ROBOT AKTİF</div><div class="meta">Son tarama: şimdi</div></div><div class="title">EN GÜÇLÜ FIRSATLAR</div><div id="list"></div><button onclick="scan()">🔄 YENİ TARAMA</button><div class="meta" style="margin:20px 4px">Demo veridir. Gerçek BIST verisi bu sürümde bağlı değildir.</div></div><nav><span>⌂ Ana Sayfa</span><span>◉ Tarama</span><span>☆ Favoriler</span><span>⚙ Ayarlar</span></nav><script>const d=[["ASELS","GÜÇLÜ AL",88],["TUPRS","GÜÇLÜ AL",82],["BIMAS","AL",79],["EREGL","AL",76],["GUBRF","İZLE",73],["THYAO","İZLE",69],["KONTR","İZLE",67],["ENJSA","İZLE",64]];function render(){list.innerHTML=d.map((x,i)=>{let c=x[1]=="İZLE"?"badge watch":"badge",e=100+i*7;return `<div class="card"><div class="row"><div><div class="sym">${i+1}. ${x[0]}</div><div class="meta">Giriş ${e} • Hedef ${e+12} • Stop ${e-6}</div></div><div style="text-align:right"><div class="${c}">${x[1]}</div><div class="score">${x[2]}<small>/100</small></div></div></div><div class="bar"><div class="fill" style="width:${x[2]}%"></div></div></div>`}).join("")}function scan(){d.sort(()=>Math.random()-.5);render()}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
