name: BIST veri bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verileri çek
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone

          symbols = [
              "ASELS", "TUPRS", "BIMAS", "EREGL", "KTLEV",
              "OZATD", "EKGYO", "MPARK", "GUBRF", "UFUK",
              "RALYH", "KRDMD", "PASEU", "SELEC", "ENJSA",
              "PETKM", "EUPWR", "MAVI", "SARKY", "GUNDG",
              "ALKLC", "CIMSA", "RGYAS", "TKFEN", "CVKMD",
              "KRDMB", "GLRMK", "GESAN", "EFOR", "BSOKE",
              "MAGEN", "AHGAZ", "KRDMA", "GENIL", "ARDYZ",
              "GMTAS", "CWENE", "USAK", "TARKM", "AKHAN",
              "SUWEN", "AAGYO", "BAHKM", "NETAS", "ALBTN",
              "AHSGY", "ALKIM", "GENTS", "MEYSU", "CATES",
              "LKMNH", "CELHA", "TKNSA", "PENTA", "YIGIT",
              "JANTS", "BRLSM", "CEMTS", "BESTE", "BORSK",
              "FORMT", "SRVGY", "KOTON", "KOPOL", "KLSYN",
              "EGEPO", "PARSN", "OZYSR", "MOPAS", "BURCE",
              "HOROZ", "KRSTL", "UCAYM", "ALCTL", "YUNSA",
              "BIENY"
          ]

          result = []
          missing = []

          for symbol in symbols:
              basarili = False

              for deneme in range(1, 4):
                  try:
                      url = f"https://api.asenax.com/bist/get/{symbol}"

                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )

                      with urllib.request.urlopen(req, timeout=20) as r:
                          raw = r.read().decode("utf-8")

                      data = json.loads(raw)

                      ana = data.get("data") or {}
                      yuzeysel = ana.get("hisseYuzeysel") or {}

                      price = yuzeysel.get("kapanis")
                      change = yuzeysel.get("yuzdedegisim")
                      volume = yuzeysel.get("hacimlot")
                      veri_zamani = yuzeysel.get("tarih")

                      if price is None:
                          raise ValueError("fiyat bulunamadı")

                      result.append({
                          "symbol": symbol,
                          "price": price,
                          "changePct": change,
                          "volume": volume,
                          "time": veri_zamani,
                          "delayed": True,
                          "source": "Asenax"
                      })

                      print(
                          f"{symbol} -> ASENAX OK | "
                          f"{price} | Deneme {deneme}"
                      )

                      basarili = True
                      break

                  except Exception as e:
                      print(
                          f"{symbol} -> Deneme {deneme} başarısız: {e}"
                      )

                      if deneme < 3:
                          time.sleep(2)

              if not basarili:
                  missing.append(symbol)
                  print(f"{symbol} -> 3 denemede veri alınamadı")

          now = datetime.now(timezone.utc).isoformat()

          output = {
              "guncelleme": now,
              "toplam_hisse": len(symbols),
              "veri_gelen": len(result),
              "veri_eksik": len(missing),
              "veriler": result
          }

          eksik = {
              "guncelleme": now,
              "toplam_hisse": len(symbols),
              "veri_gelen": len(result),
              "veri_eksik": len(missing),
              "eksik_hisseler": missing
          }

          with open("veri.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          with open("eksik-veri.json", "w", encoding="utf-8") as f:
              json.dump(eksik, f, ensure_ascii=False, indent=2)

          print("")
          print("================================")
          print(f"TOPLAM: {len(symbols)}")
          print(f"VERİ GELEN: {len(result)}")
          print(f"VERİ EKSİK: {len(missing)}")
          print("================================")
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add veri.json eksik-veri.json

          git diff --cached --quiet || git commit -m "Katılım verilerini güncelle"

          git push
