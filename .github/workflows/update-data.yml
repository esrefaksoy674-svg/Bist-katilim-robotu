name: BIST veri bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Verileri çek
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          symbols = [
              "ASELS","TUPRS","BIMAS","EREGL","KTLEV",
              "OZATD","EKGYO","MPARK","GUBRF","UFUK",
              "RALYH","KRDMD","PASEU","SELEC","ENJSA",
              "EUPWR","PETKM","MAVI","SARKY","GUNDG",
              "ALKLC","CIMSA","RGYAS","TKFEN","CVKMD",
              "KRDMB","GLRMK","GESAN","EFOR","BSOKE",
              "MAGEN","AHGAZ","KRDMA","GENIL","GMTAS",
              "CWENE","ARDYZ"
          ]

          veri = []
          eksik = []

          for symbol in symbols:
              try:
                  url = f"https://api.asenax.com/bist/get/{symbol}"

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read().decode("utf-8")

                  if not raw.strip():
                      eksik.append(symbol)
                      continue

                  data = json.loads(raw)

                  if not isinstance(data, dict):
                      eksik.append(symbol)
                      continue

                  price = data.get("price")

                  if price is None:
                      eksik.append(symbol)
                      continue

                  veri.append({
                      "symbol": symbol,
                      "price": data.get("price"),
                      "changePct": data.get("changePct"),
                      "volume": data.get("volume"),
                      "time": data.get("time"),
                      "delayed": True,
                      "source": "Asenax"
                  })

              except Exception:
                  eksik.append(symbol)

          sonuc = {
              "guncelleme": datetime.now(timezone.utc).isoformat(),
              "toplam_hisse": len(symbols),
              "veri_gelen": len(veri),
              "veri_eksik": len(eksik),
              "veri": veri
          }

          with open("veri.json", "w", encoding="utf-8") as f:
              json.dump(sonuc, f, ensure_ascii=False, indent=2)

          durum = {
              "guncelleme": datetime.now(timezone.utc).isoformat(),
              "toplam_hisse": len(symbols),
              "veri_gelen": len(veri),
              "veri_eksik": len(eksik),
              "eksik_hisseler": eksik
          }

          with open("eksik-veri.json", "w", encoding="utf-8") as f:
              json.dump(durum, f, ensure_ascii=False, indent=2)

          print("TOPLAM:", len(symbols))
          print("VERİ GELEN:", len(veri))
          print("VERİ EKSİK:", len(eksik))
          print("EKSİKLER:")

          for symbol in eksik:
              print(symbol)
          PY

      - name: JSON kontrolü
        run: |
          python -m json.tool veri.json > /dev/null
          python -m json.tool eksik-veri.json > /dev/null
          echo "JSON dosyalari gecerli."

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri.json eksik-veri.json
          git diff --cached --quiet || git commit -m "Katılım veri durumunu güncelle"
          git push
