name: BIST veri bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Katilim verilerini indir
        run: |
          python - <<'PY'
          import urllib.request, json, time

          hisseler = [
    "ASELS","TUPRS","BIMAS","EREGL","KTLEV",
    "OZATD","EKGYO","MPARK","GUBRF","UFUK",
    "RALYH","KRDMD","PASEU","SELEC","ENJSA",
    "EUPWR","PETKM","MAVI","SARKY","GUNDG",
    "ALKLC","CIMSA","RGYAS","TKFEN","CVKMD",
    "KRDMB","GLRMK","GESAN","EFOR","BSOKE",
    "MAGEN","AHGAZ","KRDMA","GENIL","GMTAS",
    "CWENE","ARDYZ"
]

          sonuc = []

          for sembol in hisseler:
              try:
                  url = "https://api.asenax.com/bist/get/" + sembol
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "application/json"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()

                  d = json.loads(raw.decode("utf-8"))
                  y = d.get("data", {}).get("hisseYuzeysel", {})

                  fiyat = y.get("satis") or y.get("alis")

                  if fiyat is not None:
                      sonuc.append({
                          "symbol": sembol,
                          "price": float(fiyat),
                          "changePct": float(y.get("yuzdedegisim") or 0),
                          "volume": float(y.get("hacimlot") or 0),
                          "time": y.get("tarih", ""),
                          "delayed": True,
                          "source": "Asenax"
                      })

                      print(sembol, "OK", fiyat)

              except Exception as e:
                  print(sembol, "HATA", e)

              time.sleep(1)

          if not sonuc:
              raise SystemExit("Hic veri alinamadi")

          with open("veri.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"veri": sonuc},
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("TOPLAM:", len(sonuc))
          PY

      - name: JSON kontrolü
        run: |
          python -c "import json; d=json.load(open('veri.json',encoding='utf-8')); print('JSON OK'); print('Kayıt:',len(d.get('veri',[]))); assert len(d.get('veri',[])) > 0"

      - name: Veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri.json
          git diff --cached --quiet || git commit -m "Katılım verisi güncelleme"
          git push
