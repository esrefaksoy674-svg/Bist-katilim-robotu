name: BIST veri bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Verileri cek
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          symbols = [
          "ASELS","TUPRS","BIMAS","EREGL","KTLEV","OZATD","EKGYO","MPARK",
          "GUBRF","UFUK","RALYH","KRDMD","PASEU","SELEC","ENJSA","PETKM",
          "EUPWR","MAVI","SARKY","GUNDG","ALKLC","CIMSA","RGYAS","TKFEN",
          "CVKMD","KRDMB","GLRMK","GESAN","EFOR","BSOKE","MAGEN","AHGAZ",
          "KRDMA","GENIL","ARDYZ","GMTAS","CWENE","USAK","TARKM","AKHAN",
          "SUWEN","AAGYO","BAHKM","NETAS","ALBTN","AHSGY","ALKIM","GENTS",
          "MEYSU","CATES","LKMNH","CELHA","TKNSA","PENTA","YIGIT","JANTS",
          "BRLSM","CEMTS","BESTE","BORSK","FORMT","SRVGY","KOTON","KOPOL",
          "KLSYN","EGEPO","PARSN","OZYSR","MOPAS","BURCE","HOROZ","KRSTL",
          "UCAYM","ALCTL","YUNSA","BIENY"
          ]

          veri = []
          eksik = []

          def kaydet(symbol, data, source):
              if not isinstance(data, dict):
                  return False

              ana = data.get("data") or data
              yuzeysel = {}

              if isinstance(ana, dict):
                  yuzeysel = ana.get("hisseYuzeysel") or ana

              price = (
                  yuzeysel.get("kapanis")
                  or yuzeysel.get("price")
                  or yuzeysel.get("last")
                  or yuzeysel.get("close")
              )

              change = (
                  yuzeysel.get("yuzdedegisim")
                  or yuzeysel.get("changePct")
                  or yuzeysel.get("change")
              )

              volume = (
                  yuzeysel.get("hacimlot")
                  or yuzeysel.get("volume")
                  or yuzeysel.get("hacim")
              )

              if price is None:
                  return False

              veri.append({
                  "symbol": symbol,
                  "price": price,
                  "changePct": change,
                  "volume": volume,
                  "time": datetime.now(timezone.utc).isoformat(),
                  "delayed": True,
                  "source": source
              })

              return True

          # ==================================================
          # 1. KAYNAK - ASENAX
          # ==================================================

          for symbol in symbols:
              try:
                  url = "https://api.asenax.com/bist/get/" + symbol

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read().decode("utf-8")

                  if not raw.strip():
                      print(symbol, "ASENAX: Bos cevap")
                      eksik.append(symbol)
                      continue

                  data = json.loads(raw)

                  if kaydet(symbol, data, "Asenax"):
                      print(symbol, "-> ASENAX OK")
                  else:
                      print(symbol, "-> ASENAX VERI YOK")
                      eksik.append(symbol)

              except Exception as e:
                  print(symbol, "-> ASENAX HATA:", repr(e))
                  eksik.append(symbol)

          # ==================================================
          # 2. KAYNAK - MIDAS
          # ==================================================

          if eksik:
              print("")
              print("MIDAS YEDEK KAYNAK BASLIYOR")
              print("Eksik hisse:", len(eksik))

              try:
                  url = "https://www.getmidas.com/wp-json/midas-api/v1/midas_table_data"

                  req = urllib.request.Request(
                      url,
                      data=b"",
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Content-Type": "application/x-www-form-urlencoded",
                          "Accept": "application/json"
                      },
                      method="POST"
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")

                  print("MIDAS cevap uzunlugu:", len(raw))

                  if raw.strip():
                      midas = json.loads(raw)

                      # Bazi cevaplar JSON string olarak donuyor.
                      if isinstance(midas, str):
                          try:
                              midas = json.loads(midas)
                          except Exception:
                              pass

                      # Listeyi bulmak icin olasi alanlar.
                      liste = midas

                      if isinstance(midas, dict):
                          for key in [
                              "data",
                              "table",
                              "stocks",
                              "result",
                              "rows",
                              "items"
                          ]:
                              if isinstance(midas.get(key), list):
                                  liste = midas[key]
                                  break

                      if isinstance(liste, list):

                          kalan = set(eksik)

                          for item in liste:

                              if not isinstance(item, dict):
                                  continue

                              symbol = (
                                  item.get("symbol")
                                  or item.get("code")
                                  or item.get("kod")
                                  or item.get("ticker")
                                  or item.get("hisse")
                                  or item.get("stockCode")
                              )

                              if symbol is None:
                                  continue

                              symbol = str(symbol).upper().strip()

                              if symbol not in kalan:
                                  continue

                              price = (
                                  item.get("price")
                                  or item.get("last")
                                  or item.get("close")
                                  or item.get("kapanis")
                                  or item.get("fiyat")
                                  or item.get("lastPrice")
                              )

                              change = (
                                  item.get("changePct")
                                  or item.get("change")
                                  or item.get("percent")
                                  or item.get("yuzde")
                                  or item.get("changePercent")
                              )

                              volume = (
                                  item.get("volume")
                                  or item.get("vol")
                                  or item.get("hacim")
                                  or item.get("volumeTL")
                              )

                              if price is not None:

                                  veri.append({
                                      "symbol": symbol,
                                      "price": price,
                                      "changePct": change,
                                      "volume": volume,
                                      "time": datetime.now(timezone.utc).isoformat(),
                                      "delayed": True,
                                      "source": "Midas"
                                  })

                                  kalan.remove(symbol)

                                  print(symbol, "-> MIDAS OK")

                          eksik = list(kalan)

                      else:
                          print("MIDAS: Liste bulunamadi.")

                  else:
                      print("MIDAS: Bos cevap.")

              except Exception as e:
                  print("MIDAS HATA:", repr(e))

          # ==================================================
          # SONUCLAR
          # ==================================================

          sonuc = {
              "guncelleme": datetime.now(timezone.utc).isoformat(),
              "toplam_hisse": len(symbols),
              "veri_gelen": len(veri),
              "veri_eksik": len(eksik),
              "veri": veri
          }

          with open("veri.json", "w", encoding="utf-8") as f:
              json.dump(
                  sonuc,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          durum = {
              "guncelleme": datetime.now(timezone.utc).isoformat(),
              "toplam_hisse": len(symbols),
              "veri_gelen": len(veri),
              "veri_eksik": len(eksik),
              "eksik_hisseler": sorted(eksik)
          }

          with open("eksik-veri.json", "w", encoding="utf-8") as f:
              json.dump(
                  durum,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("           SONUC")
          print("================================")
          print("TOPLAM:", len(symbols))
          print("VERI GELEN:", len(veri))
          print("VERI EKSIK:", len(eksik))
          print("EKSIKLER:", ", ".join(sorted(eksik)))
          print("================================")

          if len(veri) == 0:
              raise SystemExit("Hicbir kaynaktan veri alinamadi.")
          PY

      - name: JSON kontrolu
        run: |
          python -m json.tool veri.json > /dev/null
          python -m json.tool eksik-veri.json > /dev/null
          echo "JSON kontrolu basarili."

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri.json eksik-veri.json
          git diff --cached --quiet || git commit -m "Katilim verilerini iki kaynakla guncelle"
          git push
