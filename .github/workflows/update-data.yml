name: BIST veri bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Katilim hisselerini indir
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import time

          hisseler = [
            "ASELS","BIMAS","TUPRS","THYAO","FROTO",
            "TOASO","KCHOL","SAHOL","SISE","EREGL",
            "PETKM","PGSUS","ENKAI","ULKER","MAVI",
            "CCOLA","KOZAL","DOAS","MGROS","TCELL",
            "TAVHL","AKSEN","ALARK","OYAKC","SOKM",
            "TKFEN","KRDMD","HEKTS","MIATK","GESAN"
          ]

          sonuc = []

          for sembol in hisseler:
              try:
                  url = "https://api.asenax.com/bist/get/" + sembol
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "application/json"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.loads(r.read().decode("utf-8"))

                  yuzeysel = data.get("data", {}).get("hisseYuzeysel", {})

                  fiyat = yuzeysel.get("satis")
                  if not fiyat:
                      fiyat = yuzeysel.get("alis")

                  degisim = yuzeysel.get("yuzdedegisim", 0)
                  hacim = yuzeysel.get("hacimlot", 0)
                  tarih = yuzeysel.get("tarih", "")

                  if fiyat is not None:
                      sonuc.append({
                          "symbol": sembol,
                          "price": float(fiyat),
                          "changePct": float(degisim or 0),
                          "volume": float(hacim or 0),
                          "time": tarih,
                          "delayed": True,
                          "source": "Asenax"
                      })

                  print(sembol, "OK", fiyat)

              except Exception as e:
                  print(sembol, "HATA:", e)

              time.sleep(1)

          with open("veri.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"veri": sonuc},
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("TOPLAM VERI:", len(sonuc))
          PY

      - name: JSON kontrolü
        run: |
          python -c "import json; d=json.load(open('veri.json',encoding='utf-8')); print('JSON OK'); print('Kayıt:',len(d['veri']))"

      - name: Veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri.json
          git diff --cached --quiet || git commit -m "Katılım hisseleri veri güncelleme"
          git push
